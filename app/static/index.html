<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiDoc RAGOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>MultiDoc RAGOps</span>
            </div>
            <button class="new-chat-btn" id="new-chat-btn" title="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>

        <!-- Upload Section -->
        <div class="sidebar-section">
            <p class="sidebar-label">Knowledge Base</p>
            <div class="upload-zone" id="upload-zone">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="16 16 12 12 8 16"/>
                    <line x1="12" y1="12" x2="12" y2="21"/>
                    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                </svg>
                <p>Drop a file or <label for="file-input" class="upload-link">browse</label></p>
                <p class="upload-hint">PDF, DOCX, TXT, MD, CSV</p>
                <input type="file" id="file-input" accept=".txt,.md,.pdf,.docx,.csv" hidden>
            </div>
            <div id="upload-status" class="upload-status" style="display:none;"></div>
        </div>

        <!-- Documents List -->
        <div class="sidebar-section">
            <div class="sidebar-label-row">
                <span class="sidebar-label">Uploaded Documents</span>
                <button id="clear-docs-btn" class="clear-docs-btn" title="Clear all documents from knowledge base">Clear All</button>
            </div>
            <div id="doc-list" class="doc-list">
                <p class="no-docs">No documents uploaded yet.</p>
            </div>
        </div>

        <div class="sidebar-footer">
            <span>Powered by Gemini + FAISS</span>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-main">

        <!-- Empty State -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <h2>Ask your documents anything</h2>
            <p>Upload a document on the left, then ask a question below.</p>
            <div class="suggestion-chips">
                <button class="chip" data-q="What is this document about?">What is this document about?</button>
                <button class="chip" data-q="Summarize the key points.">Summarize the key points.</button>
                <button class="chip" data-q="What are the main findings?">What are the main findings?</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>

        <!-- Input Bar -->
        <div class="input-bar-wrapper">
            <div class="input-bar">
                <textarea
                    id="question-input"
                    placeholder="Ask a question about your documents…"
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button class="send-btn" id="send-btn" disabled title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <p class="disclaimer">RAGOps answers based only on ingested documents.</p>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
