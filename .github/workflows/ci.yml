name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:                                             #this is the name of the thing you are doing.
    runs-on: ubuntu-latest                                    #Give me a temporary Ubuntu Linux machine to run this job.

    steps:

      #1 checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      #2 install python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      #3 install uv
      - name: Install uv
        run: pip install uv

      #4 install dependencies
      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      #5 run pytest
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: uv run pytest

      #6 build docker image
      - name: Build Docker image
        run: docker build -t ragops:latest .
