<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiDoc RAGOps</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--primary);
        }
        form {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: var(--muted);
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            color: var(--muted);
            font-weight: 500;
            margin: 2rem 0;
        }
        #result-container {
            display: none;
        }
        .answer-box {
            background-color: #f1f5f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary);
        }
        .answer-box p { margin: 0; white-space: pre-wrap; }
        .source-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .source-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .metrics {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .metric-value { font-weight: 600; color: var(--text); }
        .error { color: #dc2626; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>MultiDoc RAGOps</h1>
            <p style="color: var(--muted); margin-bottom: 1.5rem;">Ask a question to retrieve answers directly from the ingested knowledge base.</p>
            
            <form id="ask-form">
                <input type="text" id="question" placeholder="e.g. What was Acme Corporation's revenue?" required autocomplete="off">
                <button type="submit" id="submit-btn">Ask</button>
            </form>
            
            <div id="loading">Searching documents and generating answer...</div>
            <div id="error-message" class="error" style="display: none; margin-top: 1rem;"></div>
        </div>

        <div id="result-container">
            <div class="card">
                <h3 style="margin-top: 0;">AI Answer</h3>
                <div class="answer-box">
                    <p id="answer-text"></p>
                </div>
                
                <h3>Retrieved Sources</h3>
                <div id="sources-list"></div>

                <div class="metrics">
                    <div>Total Latency: <span id="latency" class="metric-value"></span>s</div>
                    <div>Retrieval: <span id="retrieval-latency" class="metric-value"></span>s</div>
                    <div>Generation: <span id="generation-latency" class="metric-value"></span>s</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('ask-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const questionInput = document.getElementById('question');
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const errorMsg = document.getElementById('error-message');
            
            const question = questionInput.value.trim();
            if (!question) return;

            // Reset UI state
            submitBtn.disabled = true;
            questionInput.disabled = true;
            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            errorMsg.style.display = 'none';
            document.getElementById('sources-list').innerHTML = '';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'An error occurred while processing the request.');
                }

                // Populate UI
                document.getElementById('answer-text').textContent = data.answer;
                
                // Populate metrics
                document.getElementById('latency').textContent = data.latency.toFixed(3);
                document.getElementById('retrieval-latency').textContent = data.retrieval_latency.toFixed(3);
                document.getElementById('generation-latency').textContent = data.generation_latency.toFixed(3);

                // Populate sources
                const sourcesList = document.getElementById('sources-list');
                data.sources.forEach((source, index) => {
                    const sourceDiv = document.createElement('div');
                    sourceDiv.className = 'source-card';
                    sourceDiv.innerHTML = `
                        <div class="source-header">
                            <span>Source ${index + 1}</span>
                            <span>Relevance Score: ${source.score.toFixed(3)}</span>
                        </div>
                        <div>${source.chunk}</div>
                    `;
                    sourcesList.appendChild(sourceDiv);
                });

                resultContainer.style.display = 'block';

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                questionInput.disabled = false;
                loading.style.display = 'none';
                questionInput.focus();
            }
        });
    </script>
</body>
</html>
