[project]
name = "ragops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jai Kartikey", email = "jkartikey.codes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx[brotli,http2,socks]>=0.28.1",
    "numpy>=2.5.2",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[project.scripts]
ragops = "ragops:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
