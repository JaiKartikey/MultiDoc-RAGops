<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiDoc RAGOps</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>MultiDoc RAGOps</h1>
            <p style="color: var(--muted); margin-bottom: 1.5rem;">Ask a question to retrieve answers directly from the ingested knowledge base.</p>
            
            <form id="ask-form">
                <input type="text" id="question" placeholder="e.g. What was Acme Corporation's revenue?" required autocomplete="off">
                <button type="submit" id="submit-btn">Ask</button>
            </form>
            
            <div id="loading">Searching documents and generating answer...</div>
            <div id="error-message" class="error" style="display: none; margin-top: 1rem;"></div>
        </div>

        <div id="result-container">
            <div class="card">
                <h3 style="margin-top: 0;">AI Answer</h3>
                <div class="answer-box">
                    <p id="answer-text"></p>
                </div>
                
                <h3>Retrieved Sources</h3>
                <div id="sources-list"></div>

                <div class="metrics">
                    <div>Total Latency: <span id="latency" class="metric-value"></span>s</div>
                    <div>Retrieval: <span id="retrieval-latency" class="metric-value"></span>s</div>
                    <div>Generation: <span id="generation-latency" class="metric-value"></span>s</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js" defer></script>
</body>
</html>
