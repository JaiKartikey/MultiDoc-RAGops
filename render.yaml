services:
  - type: web
    name: multidoc-ragops
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set your Gemini API key in the Render dashboard
      - key: GEMINI_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
